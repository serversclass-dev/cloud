
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZB System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe
        id="appFrame"
        src="https://zoubair.pythonanywhere.com/"
        title="ZB System">
    </iframe>

    <script>
        const frame = document.getElementById("appFrame");

        // Listen for navigation messages from your Flask application.
        window.addEventListener("message", function(event) {

            // Only accept messages from your actual Flask domain.
            if (event.origin !== "https://zoubair.pythonanywhere.com") {
                return;
            }

            if (
                event.data &&
                event.data.type === "ZB_NAVIGATE" &&
                typeof event.data.url === "string"
            ) {
                const destination = new URL(
                    event.data.url,
                    "https://zoubair.pythonanywhere.com"
                );

                if (destination.origin !==
                    "https://zoubair.pythonanywhere.com") {
                    return;
                }

                window.location.href = destination.href;
            }
        });
    </script>

</body>
</html>
